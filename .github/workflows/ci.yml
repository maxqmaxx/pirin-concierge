name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Node 20 reference demonstrator
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js 20
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint source and tests
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Lint OpenAPI contract
        run: npm run openapi:lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build distributable JavaScript
        run: npm run build

      - name: Record in-process laboratory scenario
        run: |
          mkdir -p .tmp
          node scripts/record-lab-demo.mjs > .tmp/lab-transcript.json

      - name: Verify built HTTP and stdio transports
        run: node scripts/verify-transports.mjs > .tmp/transport-transcript.json

      - name: Audit locked dependencies
        run: npm audit --audit-level=high --json > .tmp/dependency-audit.json

      - name: Preserve machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: laboratory-evidence-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            .tmp/lab-transcript.json
            .tmp/transport-transcript.json
            .tmp/dependency-audit.json
            coverage/coverage-summary.json
